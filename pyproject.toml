[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "starsorty"
version = "0.2.0"
description = "自托管的 GitHub Star 智能管理系统，利用 AI 自动分类、生成摘要，构建你的私人代码知识库。"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "aliom", email = "aliom@example.com"},
]
keywords = ["github", "star", "ai", "classification", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi==0.111.1",
    "PyYAML==6.0.2",
    "aiosqlite==0.20.0",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "uvicorn[standard]==0.30.4",
    "slowapi==0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/aliom-v/StarSorty"
Documentation = "https://github.com/aliom-v/StarSorty#readme"
Repository = "https://github.com/aliom-v/StarSorty"
Issues = "https://github.com/aliom-v/StarSorty/issues"

[tool.setuptools.packages.find]
where = ["api"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["api/tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
